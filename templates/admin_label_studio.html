{% extends "base.html" %}

{% block title %}Label Studio - PETTY'S CARE{% endblock %}

{% block content %}

<section style="max-width:900px;margin:50px auto;padding:20px;">

    <h1 style="text-align:center;color:#556B2F;">
        Label Studio
    </h1>

    <p style="text-align:center;">
        Avery 22877 Sticker Labels
    </p>

    <div style="
        background:white;
        padding:30px;
        border-radius:16px;
        box-shadow:0 6px 18px rgba(0,0,0,.08);
        margin-top:30px;
    ">

        <h2>Select Product</h2>

        <select style="
            width:100%;
            padding:12px;
            font-size:16px;
        ">
            <option>Orange Sunrise</option>
            <option>Coconut Bliss</option>
            <option>Aloe Serenity</option>
            <option>Golden Turmeric</option>
            <option>Honey Glow</option>
            <option>Coffee Delight</option>
            <option>Charcoal Cleanse</option>
            <option>Almond Deluxe</option>
        </select>
        <hr style="margin:30px 0;">

<h2>Printer Calibration</h2>

<form method="POST">

    <div style="
        display:grid;
        grid-template-columns:180px 120px;
        gap:15px;
        align-items:center;
        max-width:420px;
        margin:20px auto;
    ">

        <label><strong>X Offset (inches)</strong></label>

        <input
            type="number"
            step="0.01"
            name="x_offset"
            value="{{ x_offset }}"
            style="
                padding:8px;
                text-align:center;
            ">

        <label><strong>Y Offset (inches)</strong></label>

        <input
            type="number"
            step="0.01"
            name="y_offset"
            value="{{ y_offset }}"
            style="
                padding:8px;
                text-align:center;
            ">

    </div>

    <div style="margin-top:25px;">

        <button
            type="submit"
            style="
                background:#556B2F;
                color:white;
                border:none;
                padding:14px 28px;
                border-radius:25px;
                font-weight:bold;
                cursor:pointer;
            ">
            💾 Save Calibration
        </button>

    </div>

</form>

<hr style="margin:35px 0;">
        <div style="margin-top:30px;text-align:center;">
         <form method="POST"
      action="{{ url_for('generate_logo_stickers') }}"
      style="margin-top:30px;text-align:center;">

    <button
        type="submit"
        style="
            background:#556B2F;
            color:white;
            padding:14px 28px;
            border:none;
            border-radius:25px;
            font-weight:bold;
            cursor:pointer;
        ">
        Generate Label Sheet
      <a href="{{ url_for('preview_logo_stickers') }}"
   target="_blank"
   style="
       display:inline-block;
       margin-top:15px;
       background:#B78B43;
       color:white;
       padding:12px 24px;
       border-radius:25px;
       text-decoration:none;
       font-weight:bold;
   ">
    Preview Label Sheet
</a>
    </button>
    
</form>
<form method="POST"
      action="{{ url_for('print_logo_stickers') }}"
      style="margin-top:15px;text-align:center;">

    <button type="submit"
            style="
                background:#556B2F;
                color:white;
                padding:12px 24px;
                border:none;
                border-radius:25px;
                font-weight:bold;
                cursor:pointer;
            ">
        Print Label Sheet
    </button>

</form>
        </div>

    </div>

</section>

{% endblock %}
